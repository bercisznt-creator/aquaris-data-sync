name: SofaScore Connectivity Test

on:
  workflow_dispatch:

jobs:
  connectivity-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Create test script
        run: |
          cat <<'EOF' > test.js
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1400,
                height: 1000
              }
            });

            try {
              const response = await page.goto(
                "https://www.sofascore.com/minifootball/tournament/romania/sepsi-superliga/23636",
                {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                }
              );

              console.log("Status:", response.status());

              fs.writeFileSync(
                "page.html",
                await page.content()
              );

              await page.screenshot({
                path: "screenshot.png",
                fullPage: true
              });

            } catch (err) {
              console.error(err);
            }

            await browser.close();
          })();
          EOF

      - name: Run test
        run: node test.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-test
          path: |
            screenshot.png
            page.html
